name: Offline build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline publication gate tests
        run: |
          python3 scripts/test_publish_release.py
          python3 scripts/ci/test_release.py
          bash -n scripts/ci/sign-notarize.sh
      - name: Offline preview tests
        run: bash scripts/test.sh
      - name: Compile host and filter without installation
        env:
          CCW_BUILD_MODE: host
        run: bash scripts/build.sh
